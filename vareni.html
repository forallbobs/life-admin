<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vaření</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e2e1dc;--accent:#a16207;--accent-bg:#fdf4dc;
--green:#2e7d32;--green-bg:#e9f5ea;--orange:#b45309;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#222220;--text:#eeeeea;--muted:#a3a29c;--line:#3a3a37;--accent:#facc15;--accent-bg:#3a3214;
--green:#81c995;--green-bg:#1b3021;--orange:#fbbf6a;--on-accent:#1d1d1b}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:26px;margin:4px 0 2px}
h2{font-size:21px;margin:6px 0 10px}
h3{font-size:17px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 12px}
body.embedded .top{display:none}
body.embedded .wrap{padding-top:12px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
button:hover{border-color:var(--muted)}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px;font-size:20px;font-weight:600}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.lbl{font-size:15px;color:var(--muted);margin:14px 0 6px}
.cols{display:grid;gap:14px}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{text-align:left;display:flex;flex-direction:column;gap:0;padding:8px 12px;border-radius:12px}
.chip b{font-weight:600}
.chip span{font-size:14px;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 1px var(--accent)}
.chip.on b{color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;min-height:42px;padding:6px 8px;font-size:15px;background:none;color:var(--muted)}
.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:52px;font-size:24px;padding:0;line-height:1}
.stepper .n{font-size:30px;font-weight:700;min-width:64px;text-align:center}
.stepper .u{color:var(--muted)}
.inrow{display:flex;align-items:center;gap:8px}
.inrow input{max-width:180px}
.pp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:15px;color:var(--muted)}
.pp input{width:84px;font-size:17px;min-height:40px;padding:6px 8px}
.pp .reset{min-height:36px;padding:4px 10px;font-size:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:16px;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;flex:none;accent-color:var(--accent)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:560px){.tiles{grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--bg);border-radius:10px;padding:8px 10px}
.tile .k{font-size:14px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;line-height:1.25}
.tile .s{font-size:13px;color:var(--muted)}
.tile.main{background:var(--accent-bg)}
.tile.main .v{color:var(--accent);font-size:26px}
.note{font-size:15px;color:var(--muted);margin:10px 0 0}
.steps{margin:0;padding-left:22px}
.steps li{margin:6px 0}
.timers{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.timers button{flex:1;min-width:150px;font-weight:600}
.tbar{position:fixed;left:12px;right:12px;bottom:12px;max-width:560px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20}
.tbar[hidden]{display:none}
.tbar .tt{flex:1}
.tbar .tl{font-size:14px;opacity:.8}
.tbar .tc{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.tbar button{background:transparent;color:inherit;border-color:currentColor;opacity:.9}
.tbar.done{background:var(--green);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.75}}
details{margin-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:15px}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
.ver{font-size:13px;color:var(--muted);margin-top:24px;opacity:.8}
/* ===== Záložky a Moje jídla ===== */
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.vtabs{display:flex;gap:6px;margin:4px 0 14px;border-bottom:1px solid var(--line)}
.vtabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;font-size:17px;padding:8px 14px;color:var(--muted)}
.vtabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.mtools{display:flex;gap:8px;flex-wrap:wrap}
.mtools input{flex:1;min-width:180px}
.mtools input,.mtools select{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:44px;font:inherit;color:inherit}
.tagchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tagchips button,.ftags button{border-radius:999px;padding:5px 12px;min-height:36px;font-size:14px}
.tagchips button.on,.ftags button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);font-weight:600}
.mact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mact button{flex:1;min-width:140px}
.mcards{display:grid;gap:8px}
@media(min-width:800px){.mcards{grid-template-columns:1fr 1fr}}
@media(min-width:1150px){.mcards{grid-template-columns:1fr 1fr 1fr}}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.mcard:hover{border-color:var(--muted)}
.mcard .mi{font-size:28px;line-height:1;flex:none}
.mcard .mt{flex:1;min-width:0}
.mcard .mt b{display:block;overflow:hidden;text-overflow:ellipsis}
.mcard .ms{font-size:14px;color:var(--muted)}
.mcard .ms .never{color:var(--accent);font-weight:600}
.mcard .cookbtn{flex:none;padding:6px 10px;font-size:15px}
.mtg{display:inline-block;font-size:12px;background:var(--bg);border-radius:999px;padding:1px 8px;margin:3px 4px 0 0;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty b{display:block;color:var(--text);font-size:19px;margin-bottom:4px}
/* okno */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:25}
.overlay.open{display:flex}
.modal{background:var(--card);width:100%;max-width:600px;border-radius:16px 16px 0 0;padding:20px;max-height:92vh;overflow:auto}
@media(min-width:600px){.overlay{align-items:center}.modal{border-radius:16px}}
.modal h2{margin:0 0 4px;font-size:22px}
.mfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:16px}
.mfoot>div{display:flex;flex-wrap:wrap;gap:8px}
.modal label{display:block;font-size:15px;color:var(--muted);margin:12px 0 4px}
.modal label.check{display:flex;align-items:center;gap:10px;color:var(--text);font-size:16px;cursor:pointer}
.modal label.check input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--accent)}
.modal input:not([type=checkbox]),.modal select,.modal textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px;font:inherit;color:inherit}
.modal textarea{resize:vertical}
.frow{display:flex;gap:8px}.frow>*{flex:1;min-width:0}
.hint{font-size:14px;color:var(--muted);margin-top:4px}
.err{color:#c62828;font-size:14px;margin-top:4px}
.dmeta{color:var(--muted);font-size:15px;margin-bottom:8px}
.dbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.dbtns button{flex:1;min-width:130px}
.dsec{margin-top:16px}
.dsec h3{font-size:16px;margin:0 0 6px}
.serv{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);margin-bottom:6px}
.serv button{width:40px;min-height:36px;padding:0;font-size:20px}
.serv b{font-size:20px;color:var(--text);min-width:28px;text-align:center}
.ing{margin:0;padding-left:20px}
.ing li{margin:3px 0}
.ing .q{font-weight:700}
.cookbox{background:var(--accent-bg);border-radius:12px;padding:6px 12px 12px;margin-top:8px}
.hist{margin:0;padding:0;list-style:none}
.hist li{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:5px 0;font-size:15px}
.hist li:last-child{border-bottom:0}
.hist .hx{flex:1}.hist .hn{color:var(--muted)}
.hist button{min-height:32px;padding:2px 10px;font-size:14px}
button.confirm{border-color:#c62828;color:#c62828}
.pick{text-align:center;padding:10px 0}
.pick .pi{font-size:56px;line-height:1.2}
.pick b{display:block;font-size:24px}
.shopr{border-bottom:1px solid var(--line);padding:6px 0}
.shopr:last-child{border-bottom:0}
.shopr .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shopr .sh button{min-height:32px;padding:2px 10px;font-size:14px}
.shopr ul{margin:2px 0 0;padding-left:20px;font-size:15px}
.mshare{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.mshare button{font-size:15px}
.sel{list-style:none;margin:6px 0 0;padding:0}
.sel li{border-bottom:1px solid var(--line)}
.sel li:last-child{border-bottom:0}
.sel label.check{margin:0;padding:8px 0}
.sel .st{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:92%}
.toast.show{opacity:1}
.toast.act{pointer-events:auto}
.toast button{margin-left:10px;min-height:32px;padding:2px 10px;background:none;color:inherit;border-color:currentColor}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🍳 Vaření</h1>
    <p class="sub">Moje jídla s recepty a kalkulačka rýže.</p>
  </header>
  <div class="vtabs" role="tablist"><button role="tab" data-tab="rice">🍚 Rýže</button><button role="tab" data-tab="meals">📖 Moje jídla</button></div>
  <section id="secRice">
  <h2>🍚 Rýže</h2>
  <div class="cols">
    <div class="card">
      <div class="lbl" style="margin-top:0">Na co ji vaříš</div>
      <div class="chips" id="types"></div>
      <div class="pp" id="ppRow"></div>
      <div class="lbl">Počítat podle</div>
      <div class="seg" id="modes" role="group" aria-label="Počítat podle">
        <button data-mode="persons">Počtu osob</button><button data-mode="rice">Rýže (g)</button><button data-mode="water">Vody (ml)</button>
      </div>
      <div id="inputBox" style="margin-top:12px"></div>
      <label class="check" id="leakyRow"><input type="checkbox" id="leaky"><span>Poklička netěsní nebo má otvor na páru <span style="color:var(--muted)">(přidá trochu vody)</span></span></label>
    </div>
    <div class="card" id="result"></div>
  </div>
  <div class="card" style="margin-top:14px" id="howto"></div>
  </section>
  <section id="secMeals" hidden>
    <div class="mtools"><input type="search" id="q" placeholder="Hledat jídlo nebo surovinu…" aria-label="Hledat">
      <select id="sort" aria-label="Řazení"><option value="stale">Nejdéle nevařené</option><option value="az">Abecedně</option><option value="often">Nejčastěji vařené</option></select></div>
    <div class="tagchips" id="tagChips"></div>
    <div class="mact"><button id="btnPick">🎲 Co dnes vařit?</button><button id="btnShop">🛒 Nákup <span id="shopN"></span></button><button class="primary" id="btnAdd">+ Přidat jídlo</button></div>
    <div class="mcards" id="mealList"></div>
    <div class="mshare"><button id="btnExport">📤 Sdílet recepty</button><button id="btnImport">📥 Načíst recepty od někoho</button></div>
    <input type="file" id="fileRec" accept=".json,application/json" hidden>
  </section>
  <div class="ver" id="ver"></div>
</div>
<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <h2 id="mTitle"></h2><div id="mBody"></div>
  <div class="mfoot"><div id="mLeft"></div><div><button id="mCancel">Zrušit</button><button class="primary" id="mSave">Uložit</button></div></div>
</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tbar" id="tbar" hidden role="status" aria-live="polite"><div class="tt"><div class="tl" id="tLabel"></div><div class="tc" id="tCount"></div></div><button id="tStop">Zrušit</button></div>

<script>
const APP_ID='vareni',APP_VERSION='2026.11.24';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseNum=v=>{const s=String(v??'').replace(/\s/g,'').replace(',','.');return s===''?NaN:Number(s);};
const nf=(v,d=0)=>new Intl.NumberFormat('cs-CZ',{maximumFractionDigits:d}).format(v);
const mem={};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v;saveWarn()}}};

// Typy jídla – liší se dávkou na osobu (a rizoto i postupem)
const TYPES=[
  {id:'side', icon:'🍛',name:'Příloha',      pp:75, hint:'k masu, omáčce'},
  {id:'big',  icon:'🍽️',name:'Větší porce', pp:100,hint:'větší jedlíci, do krabičky'},
  {id:'fried',icon:'🥡',name:'Smažená rýže', pp:100,hint:'samostatné jídlo'},
  {id:'risotto',icon:'🧀',name:'Rizoto',     pp:100,hint:'arborio, s vývarem'},
];
const RATIO=1.5;   // 1 g rýže : 1,5 ml vody

const KEY='vareni.settings.v1';
let S={type:'side',mode:'persons',persons:4,rice:'',water:'',leaky:false,pp:{}};
try{const s=JSON.parse(store.get(KEY)||'null');if(s)S={...S,...s,pp:{...(s.pp||{})}};}catch(e){}
if(!TYPES.some(t=>t.id===S.type))S.type='side';
const save=()=>store.set(KEY,JSON.stringify(S));
const typ=()=>TYPES.find(t=>t.id===S.type);
const ppOf=()=>{const v=Number(S.pp[S.type]);return v>0?v:typ().pp;};

// Hodnoty z tabulky v tvém návodu (podle gramů rýže) – mezi řádky se dopočítá
const T_SALT=[[80,.15],[160,.5],[250,1],[300,1],[350,1.15],[500,1.5]];      // čajové lžičky
const T_FAT =[[80,1],[160,1.5],[250,3],[350,3],[500,4.5]];                   // čajové lžičky (1 lžíce = 3 lžičky)
const T_COOK=[[80,10,12],[160,12,12],[250,12,12],[300,12,13],[350,12,13],[500,13,15]];
const T_REST=[[80,5,5],[160,5,8],[250,8,10],[350,10,10],[500,10,10]];
function interp(tab,g,col=1,scaleUp=false){
  if(g<=tab[0][0])return tab[0][col];
  const last=tab[tab.length-1];
  if(g>=last[0])return scaleUp?last[col]*g/last[0]:last[col];
  for(let i=1;i<tab.length;i++)if(g<=tab[i][0]){const a=tab[i-1],b=tab[i],f=(g-a[0])/(b[0]-a[0]);return a[col]+(b[col]-a[col])*f;}
}
const r5=v=>Math.round(v/5)*5;
const plural=(n,a,b,c)=>n===1?a:(n>=2&&n<=4?b:c);
function frac(v){   // 1.5 → „1½“
  const q=Math.round(v*4)/4,w=Math.floor(q),f=q-w;
  const fs={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[f];
  return (w?String(w):'')+fs||'0';
}
function tsp(v){
  if(v<0.2)return'špetka';
  const q=Math.round(v*4)/4;
  return `${frac(q)} ${q===1?'lžička':(Number.isInteger(q)&&q>=2&&q<=4?'lžičky':Number.isInteger(q)?'lžiček':'lžičky')}`;
}
function fat(v){
  if(v<2.75){const q=Math.round(v*2)/2;return `${frac(q)} ${q===1?'lžička':'lžičky'}`;}
  const l=Math.round(v/3*2)/2;return `${frac(l)} ${l===1?'lžíce':Number.isInteger(l)&&l>=5?'lžic':'lžíce'}`;
}
const range=(a,b)=>{a=Math.round(a);b=Math.round(b);return a===b?`${a} min`:`${a}–${b} min`;};

// Hlavní výpočet: z vybraného vstupu → gramy rýže
function riceGrams(){
  if(S.mode==='persons')return S.persons*ppOf();
  if(S.mode==='rice'){const g=parseNum(S.rice);return g>0?g:null;}
  const ml=parseNum(S.water);if(!(ml>0))return null;
  return S.type==='risotto'?ml/3.5:Math.max(0,(ml-(S.leaky?leakExtra(ml/RATIO):0)))/RATIO;
}
const leakExtra=g=>g<=160?10:20;

function renderControls(){
  $('types').innerHTML=TYPES.map(t=>`<button class="chip${t.id===S.type?' on':''}" data-type="${t.id}" aria-pressed="${t.id===S.type}"><b>${t.icon} ${t.name}</b><span>${t.id===S.type?ppOf():t.pp} g na osobu · ${t.hint}</span></button>`).join('');
  const custom=Number(S.pp[S.type])>0;
  $('ppRow').innerHTML=`Na osobu <input type="text" inputmode="decimal" id="ppIn" value="${ppOf()}" aria-label="Gramů rýže na osobu"> g syrové rýže
    ${custom?`<button class="reset" id="ppReset">Zpět na ${typ().pp} g</button>`:''}`;
  document.querySelectorAll('#modes [data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===S.mode));
  $('modes').querySelector('[data-mode=water]').textContent=S.type==='risotto'?'Vývaru (ml)':'Vody (ml)';
  let h='';
  if(S.mode==='persons')h=`<div class="stepper"><button data-step="-1" aria-label="O osobu méně">−</button><div class="n" id="pN">${S.persons}</div><div class="u">${plural(S.persons,'osoba','osoby','osob')}</div><button data-step="1" aria-label="O osobu více">+</button></div>`;
  else if(S.mode==='rice')h=`<div class="inrow"><input type="text" inputmode="decimal" id="inRice" value="${esc(S.rice)}" placeholder="např. 230"><span>g syrové rýže</span></div>`;
  else h=`<div class="inrow"><input type="text" inputmode="decimal" id="inWater" value="${esc(S.water)}" placeholder="např. 500"><span>ml ${S.type==='risotto'?'vývaru':'vody'}</span></div>`;
  $('inputBox').innerHTML=h;
  $('leakyRow').hidden=S.type==='risotto';
  $('leaky').checked=!!S.leaky;
}

function renderResult(){
  const g=riceGrams(),t=typ();
  if(!(g>0)){$('result').innerHTML=`<h3>Výsledek</h3><p class="note" style="margin:0">Zadej ${S.mode==='rice'?'kolik máš rýže':'kolik máš '+(S.type==='risotto'?'vývaru':'vody')}.</p>`;renderHowto(null);return;}
  const rice=r5(g),portions=g/ppOf();
  const pTxt=S.mode==='persons'?`${S.persons} ${plural(S.persons,'osoba','osoby','osob')} × ${ppOf()} g`:`≈ ${nf(portions,1)} ${portions<1.5?'porce':portions<4.5?'porce':'porcí'} (${t.name.toLowerCase()}, ${ppOf()} g/os.)`;
  let tiles='',note='',x;
  if(S.type==='risotto'){
    x={cook:[18,20],rest:[2,2]};
    const broth=r5(g*3.5),onion=Math.max(1,Math.ceil(g/300)),butter=r5(g*.15),parm=r5(g*.2),wine=r5(g*.3);
    tiles=`<div class="tile main"><div class="k">Rýže (arborio)</div><div class="v">${nf(rice)} g</div><div class="s">${pTxt}</div></div>

let tEnd=0,tLabel='',tInt=null,actx=null,wake=null,beepInt=null;
function startTimer(min,label){
  stopTimer();
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();}catch(e){}
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});}catch(e){}
  tEnd=Date.now()+min*60e3;tLabel=label;$('tLabel').textContent=label;$('tbar').hidden=false;$('tbar').classList.remove('done');$('tStop').textContent='Zrušit';
  tick();tInt=setInterval(tick,500);
}
function tick(){
  const left=Math.max(0,Math.round((tEnd-Date.now())/1000));
  $('tCount').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  if(left===0){clearInterval(tInt);tInt=null;$('tbar').classList.add('done');$('tLabel').textContent=tLabel+' – hotovo!';$('tStop').textContent='OK';
    beep();beepInt=setInterval(beep,2500);setTimeout(()=>{clearInterval(beepInt);beepInt=null;},30000);
    try{navigator.vibrate&&navigator.vibrate([400,200,400,200,400]);}catch(e){}}
}
function beep(){
  try{if(!actx)return;const t=actx.currentTime;
    [0,.3,.6].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,t+d);
      g.gain.exponentialRampToValueAtTime(.3,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.22);o.connect(g).connect(actx.destination);o.start(t+d);o.stop(t+d+.25);});
  }catch(e){}
}
function stopTimer(){clearInterval(tInt);tInt=null;clearInterval(beepInt);beepInt=null;$('tbar').hidden=true;try{wake&&wake.release();}catch(e){}wake=null;}
$('tStop').onclick=stopTimer;
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tInt)tick();});

const isoD=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const isISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s))&&!isNaN(parseD(s));
const today=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());};
const daysBetween=(a,b)=>Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5);
const fmtD=iso=>{const d=parseD(iso);return`${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}`;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function ago(iso){
  const n=daysBetween(parseD(iso),today());
  if(n<0)return fmtD(iso);if(n===0)return'dnes';if(n===1)return'včera';
  if(n<14)return`před ${n} dny`;
  if(n<60){const w=Math.round(n/7);return`před ${w} týdny`;}
  if(n<365){const m=Math.round(n/30.4);return m<=1?'před měsícem':`před ${m} měsíci`;}
  const y=Math.floor(n/365);return y===1?'před rokem':`před ${y} lety`;
}

const UF={'½':.5,'¼':.25,'¾':.75,'⅓':1/3,'⅔':2/3};
const num=s=>Number(String(s).replace(',','.'));
function parseQty(line){
  const t=line.replace(/^\s*[-•*]\s*/,'');let m;
  if((m=t.match(/^(\d+(?:[.,]\d+)?)\s*[-–]\s*(\d+(?:[.,]\d+)?)(?=\s|[a-zA-ZÀ-ž]|$)/)))return{a:num(m[1]),b:num(m[2]),rest:t.slice(m[0].length)};
  if((m=t.match(/^(\d+)\s+(?:a\s+)?(\d+)\s*\/\s*(\d+)(?=\s|[a-zA-ZÀ-ž]|$)/))&&Number(m[3])>0)return{a:Number(m[1])+Number(m[2])/Number(m[3]),rest:t.slice(m[0].length)};
  if((m=t.match(/^(\d+)\s*\/\s*(\d+)(?=\s|[a-zA-ZÀ-ž]|$)/))&&Number(m[2])>0)return{a:Number(m[1])/Number(m[2]),rest:t.slice(m[0].length)};
  if((m=t.match(/^(\d+(?:[.,]\d+)?)?\s*([½¼¾⅓⅔])?(?=\s|[a-zA-ZÀ-ž]|$)/))&&(m[1]||m[2]))return{a:(m[1]?num(m[1]):0)+(m[2]?UF[m[2]]:0),rest:t.slice(m[0].length)};
  return{a:null,rest:t};
}
function fmtQ(v,rest){
  if(/^\s*(?:g|ml|gramů|gr)(?=$|[\s.,;)])/i.test(rest)){if(v>=200)return nf(Math.round(v/10)*10);if(v>=50)return nf(Math.round(v/5)*5);}
  if(v>=10)return nf(Math.round(v));
  const q=Math.round(v*4)/4;if(Math.abs(q-v)<0.06&&q>0)return frac(q);
  return nf(Math.round(v*10)/10,1);
}
function scaledLines(m,serv){
  const f=serv/m.servings;
  return m.ingredients.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=parseQty(l);
    if(p.a==null||f===1)return{q:p.a!=null?l.slice(0,l.length-p.rest.length).replace(/^\s*[-•*]\s*/,'').trim():'',rest:p.a!=null?p.rest.trim():p.rest.trim()};
    const q=p.b!=null?`${fmtQ(p.a*f,p.rest)}–${fmtQ(p.b*f,p.rest)}`:fmtQ(p.a*f,p.rest);
    return{q,rest:p.rest.trim()};
  });
}

  const stale=m=>{const l=lastCooked(m);return l?daysBetween(parseD(l),today()):1e6;};
  if(MS.sort==='az')list.sort((a,b)=>a.name.localeCompare(b.name,'cs'));

  }).join('');
}

function openModal(title,body,onSave,opts={}){
  $('mTitle').textContent=title;$('mBody').innerHTML=body;mSave=onSave||null;
  $('mSave').hidden=!onSave;$('mSave').disabled=false;$('mSave').textContent=opts.saveLabel||'Uložit';$('mCancel').textContent=onSave?'Zrušit':'Zavřít';
  $('mLeft').innerHTML=opts.left||'';mNoDirty=!!opts.noDirty;
  $('overlay').classList.add('open');mArmed=false;mSnap=snapM();
  if(opts.focus)setTimeout(()=>{const f=$(opts.focus);if(f)f.focus();},60);
}
function closeModal(){$('overlay').classList.remove('open');mSave=null;mArmed=false;detailId=null;if(pendingReload){pendingReload=false;setTimeout(reloadMeals,0);}}
function requestClose(){
  if(!$('overlay').classList.contains('open'))return;
  if(!mSave||mNoDirty||snapM()===mSnap||mArmed){closeModal();return;}
  mArmed=true;clearTimeout(mArmT);mArmT=setTimeout(()=>mArmed=false,4000);
  toast('Máš neuložené změny. Zavři znovu pro zahození, nebo dej Uložit.');
}
function reloadMeals(){meals=loadMeals();renderMeals();}
$('mCancel').onclick=()=>requestClose();
$('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')requestClose();});
$('mSave').onclick=async()=>{if(!mSave)return;const r=await mSave();if(r!==false)closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')requestClose();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('mcard')){e.preventDefault();openDetail(e.target.dataset.open);}});
window.addEventListener('storage',e=>{
  if(e.key===MKEY){if($('overlay').classList.contains('open'))pendingReload=true;else reloadMeals();}
  if(e.key===SHOPKEY){try{const s=JSON.parse(e.newValue||'[]');if(Array.isArray(s))shop=s;}catch(x){}if(tab==='meals')renderMeals();}
});

// ----- toast (s tlačítkem Zpět) -----
let toastT,toastFn=null;
function toast(m,btn,fn){const t=$('toast');t.innerHTML=esc(m)+(btn?`<button id="tBtn">${esc(btn)}</button>`:'');t.classList.toggle('act',!!btn);toastFn=fn||null;
  t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>{t.classList.remove('show','act');toastFn=null;},btn?6000:3000);}
$('toast').addEventListener('click',e=>{if(e.target.id==='tBtn'&&toastFn){toastFn();toastFn=null;$('toast').classList.remove('show','act');}});

// ----- detail jídla -----
let detailId=null,detailServ=4,cookOpen=false;
function openDetail(id){const m=mealById(id);if(!m)return;detailId=id;detailServ=m.servings;cookOpen=false;openModal(m.icon+' '+m.name,detailHtml(m),null);}
function redrawDetail(){const m=mealById(detailId);if(!m){closeModal();return;}$('mTitle').textContent=m.icon+' '+m.name;$('mBody').innerHTML=detailHtml(m);}
function detailHtml(m){
  const l=lastCooked(m);
  const meta=[l?`Naposledy ${ago(l)} (${fmtD(l)})`:'Ještě nevařeno',m.cooked.length?`vařeno ${m.cooked.length}×`:'',m.time?`⏱️ ${m.time} min`:''].filter(Boolean).join(' · ');
  const ing=scaledLines(m,detailServ),steps=stepList(m);
  const src=/^https?:\/\//i.test(m.source.trim())?`<a href="${esc(m.source.trim())}" target="_blank" rel="noopener">${esc(m.source.trim().replace(/^https?:\/\/(www\.)?/,'').slice(0,60))}</a>`:esc(m.source);
  return`<div class="dmeta">${meta}${m.tags.length?`<div>${m.tags.map(t=>`<span class="mtg">${esc(t)}</span>`).join('')}</div>`:''}</div>
  <div class="dbtns"><button class="primary" data-dcook>✅ Vařeno…</button><button data-dedit>✏️ Upravit</button><button data-dtext title="Poslat recept jako text">📤 Poslat</button></div>
  ${cookOpen?`<div class="cookbox"><div class="frow"><div><label for="cDate">Kdy</label><input type="date" id="cDate" value="${isoD(today())}" max="${isoD(today())}"></div></div>
    <label for="cNote">Poznámka (nepovinné)</label><input type="text" id="cNote" maxlength="200" placeholder="např. příště méně soli">
    <div class="dbtns"><button class="primary" data-dcooksave>Zapsat</button><button data-dcookcancel>Zrušit</button></div></div>`:''}
  ${ing.length?`<div class="dsec"><h3>Suroviny</h3>
    <div class="serv">Pro <button data-serv="-1" aria-label="Méně porcí">−</button><b>${detailServ}</b><button data-serv="1" aria-label="Více porcí">+</button> ${plural(detailServ,'osobu','osoby','osob')}${detailServ!==m.servings?` <span>(recept je pro ${m.servings})</span>`:''}</div>
    <ul class="ing">${ing.map(x=>`<li>${x.q?`<span class="q">${esc(x.q)}</span> `:''}${esc(x.rest)}</li>`).join('')}</ul>
    <div class="dbtns"><button data-dshop>🛒 Do nákupu</button>${m.rice?`<button data-drice>🍚 Spočítat rýži pro ${detailServ}</button>`:''}</div></div>`
   :(m.rice?`<div class="dbtns"><button data-drice>🍚 Spočítat rýži pro ${detailServ}</button></div>`:'')}
  ${steps.length?`<div class="dsec"><h3>Postup</h3><ol class="steps">${steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`:''}
  ${m.note.trim()?`<div class="dsec"><h3>Poznámky</h3><div style="white-space:pre-wrap">${esc(m.note)}</div></div>`:''}
  ${m.source.trim()?`<div class="dsec"><h3>Zdroj</h3>${src}</div>`:''}
  ${!ing.length&&!steps.length?`<p class="hint">Recept zatím nemá suroviny ani postup – doplníš je přes ✏️ Upravit.</p>`:''}
  ${m.cooked.length?`<div class="dsec"><h3>Kdy jsem vařil</h3><ul class="hist">${[...m.cooked].map((c,i)=>({c,i})).reverse().slice(0,30).map(({c,i})=>`<li><div class="hx">${fmtD(c.date)}${c.note?` <span class="hn">– ${esc(c.note)}</span>`:''}</div><button data-hdel="${i}" title="Smazat záznam">🗑️</button></li>`).join('')}</ul></div>`:''}`;
}
function addCooked(m,date,note){
  if(m.cooked.some(c=>c.date===date&&!note)){toast('Ten den už je zapsaný');return false;}
  const entry={date,note:note||''};m.cooked.push(entry);m.cooked.sort((a,b)=>a.date.localeCompare(b.date));saveMeals();renderMeals();
  toast(`✅ ${m.name} – ${date===isoD(today())?'dnes':fmtD(date)}`,'↩️ Zpět',()=>{m.cooked=m.cooked.filter(c=>c!==entry);saveMeals();renderMeals();if(detailId===m.id)redrawDetail();toast('Vráceno');});
  return true;
}
$('mBody').addEventListener('click',e=>{
  const m=detailId&&mealById(detailId);
  if(e.target.closest('[data-dcook]')){cookOpen=true;redrawDetail();setTimeout(()=>$('cNote')&&$('cNote').focus(),50);return;}
  if(e.target.closest('[data-dcookcancel]')){cookOpen=false;redrawDetail();return;}
  if(e.target.closest('[data-dcooksave]')&&m){const d=$('cDate').value;if(!isISO(d)||d>isoD(today())){toast('Zadej datum (nejpozději dnes)');return;}
    if(addCooked(m,d,$('cNote').value.trim())){cookOpen=false;redrawDetail();}return;}
  if(e.target.closest('[data-dedit]')&&m){editForm(m);return;}
  if(e.target.closest('[data-dtext]')&&m){shareText(m.name,recipeText(m,detailServ));return;}
  if(e.target.closest('[data-selall]')){const on=!$('mBody').querySelector('.sel input:not(:checked):not(:disabled)');$('mBody').querySelectorAll('.sel input:not(:disabled)').forEach(c=>c.checked=!on);updSelN();return;}
  const sv=e.target.closest('[data-serv]');
  if(sv){detailServ=Math.min(50,Math.max(1,detailServ+Number(sv.dataset.serv)));redrawDetail();return;}
  if(e.target.closest('[data-dshop]')&&m){addToShop(m,detailServ);return;}
  if(e.target.closest('[data-drice]')&&m){
    S.mode='persons';S.persons=detailServ;if(S.type==='risotto')S.type='side';save();
    closeModal();setTab('rice');render();window.scrollTo({top:0,behavior:'smooth'});toast(`🍚 Rýže pro ${detailServ} ${plural(detailServ,'osobu','osoby','osob')}`);return;}
  const hd=e.target.closest('[data-hdel]');
  if(hd&&m){
    if(!hd.classList.contains('confirm')){hd.classList.add('confirm');hd.textContent='Opravdu?';setTimeout(()=>{if(hd.isConnected){hd.classList.remove('confirm');hd.textContent='🗑️';}},4000);return;}
    const c=m.cooked[Number(hd.dataset.hdel)];if(!c)return;
    m.cooked=m.cooked.filter(x=>x!==c);saveMeals();renderMeals();redrawDetail();
    toast(`Smazáno: ${fmtD(c.date)}`,'↩️ Zpět',()=>{m.cooked.push(c);m.cooked.sort((a,b)=>a.date.localeCompare(b.date));saveMeals();renderMeals();if(detailId===m.id)redrawDetail();});return;}
  const tg=e.target.closest('[data-tg]');
  if(tg){tg.classList.toggle('on');syncTags();return;}
  const pk=e.target.closest('[data-pick]');
  if(pk){if(pk.dataset.pick==='again')pickMeal();else openDetail(pk.dataset.pick);return;}
  const sr=e.target.closest('[data-sdel]');
  if(sr){shop=shop.filter(x=>x.id!==sr.dataset.sdel);saveShop();renderMeals();openShop();return;}
});

// ----- přidat / upravit -----
let delArmed=false;
function syncTags(){const sel=[...$('mBody').querySelectorAll('.ftags [data-tg].on')].map(b=>b.dataset.tg);$('fTags').value=sel.join('|');}
function editForm(m){
  const isNew=!m;m=m||{name:'',icon:'🍽️',tags:[],time:null,servings:4,ingredients:'',steps:'',note:'',source:'',rice:false};
  delArmed=false;detailId=isNew?null:m.id;
  const tags=[...new Set([...allTags(),...m.tags])];
  openModal(isNew?'Nové jídlo':'Upravit jídlo',`
    <div class="frow"><div style="flex:0 0 80px"><label for="fIcon">Ikona</label><input type="text" id="fIcon" value="${esc(m.icon)}" maxlength="8" style="text-align:center;font-size:22px"></div>
      <div><label for="fName">Název jídla</label><input type="text" id="fName" value="${esc(m.name)}" maxlength="80" placeholder="např. Boloňské špagety"></div></div>
    <div class="err" id="eName"></div>
    <div class="frow"><div><label for="fServ">Recept je pro (osob)</label><input type="text" inputmode="numeric" id="fServ" value="${m.servings}"></div>
      <div><label for="fTime">Doba přípravy (min)</label><input type="text" inputmode="numeric" id="fTime" value="${m.time??''}" placeholder="nepovinné"></div></div>
    <label>Štítky</label><div class="ftags tagchips" style="margin:0">${tags.map(t=>`<button type="button" data-tg="${esc(t)}"${m.tags.includes(t)?' class="on"':''}>${esc(t)}</button>`).join('')}</div>
    <input type="hidden" id="fTags" value="${esc(m.tags.join('|'))}">
    <input type="text" id="fTagNew" placeholder="Vlastní štítek (víc oddělit čárkou)" style="margin-top:8px">
    <label for="fIng">Suroviny – každá na nový řádek</label>
    <textarea id="fIng" rows="7" placeholder="400 g špaget&#10;500 g mletého masa&#10;1 cibule&#10;2 stroužky česneku&#10;sůl, pepř">${esc(m.ingredients)}</textarea>
    <div class="hint">Množství pište na začátek řádku (400 g…, 1½ lžičky…, 2–3 stroužky…) – pak se přepočítá na jiný počet osob.</div>
    <label for="fSteps">Postup – každý krok na nový řádek</label>
    <textarea id="fSteps" rows="7" placeholder="Na oleji osmahni cibuli…&#10;Přidej maso a opeč…">${esc(m.steps)}</textarea>
    <label for="fNote">Poznámky</label><textarea id="fNote" rows="2" placeholder="např. nejlepší druhý den">${esc(m.note)}</textarea>
    <label for="fSrc">Zdroj (odkaz nebo kniha, nepovinné)</label><input type="text" id="fSrc" value="${esc(m.source)}" placeholder="https://…">
    <label class="check" style="margin-top:14px"><input type="checkbox" id="fRice"${m.rice?' checked':''}> Příloha je rýže <span style="color:var(--muted);font-size:14px">(tlačítko na kalkulačku)</span></label>`,
  ()=>{
    const name=$('fName').value.trim();if(!name){$('eName').textContent='Napiš název jídla.';$('fName').focus();return false;}
    const tagsSel=$('fTags').value.split('|').filter(Boolean),extra=$('fTagNew').value.split(',').map(t=>t.trim()).filter(Boolean);
    const data={name,icon:$('fIcon').value,tags:[...tagsSel,...extra],servings:parseNum($('fServ').value),time:parseNum($('fTime').value),
      ingredients:$('fIng').value.trim(),steps:$('fSteps').value.trim(),note:$('fNote').value.trim(),source:$('fSrc').value.trim(),rice:$('fRice').checked};
    if(isNew){const n=normMeal({id:uid(),...data,cooked:[],createdAt:new Date().toISOString()});meals.push(n);saveMeals();renderMeals();
      setTimeout(()=>{openDetail(n.id);toast('Uloženo');},0);}
    else{const n=normMeal({...m,...data});Object.assign(m,n);saveMeals();renderMeals();const id=m.id;setTimeout(()=>{openDetail(id);toast('Uloženo');},0);}
  },{focus:isNew?'fName':null,left:isNew?'':'<button id="btnDel">🗑️ Smazat jídlo</button>'});
}
$('mLeft').addEventListener('click',e=>{
  if(e.target.id!=='btnDel')return;const m=detailId&&mealById(detailId);if(!m)return;
  if(!delArmed){delArmed=true;e.target.classList.add('confirm');e.target.textContent='Opravdu smazat?';return;}
  const idx=meals.indexOf(m);meals=meals.filter(x=>x!==m);saveMeals();closeModal();renderMeals();
  toast(`Smazáno: ${m.name}`,'↩️ Zpět',()=>{meals.splice(Math.min(idx,meals.length),0,m);saveMeals();renderMeals();});
});

// ----- 🎲 Co dnes vařit? -----
let lastPick=null;
function pickMeal(){
  let pool=meals.filter(m=>!MS.tag||m.tags.includes(MS.tag));
  if(!pool.length){toast(meals.length?'Pro vybraný štítek tu nic není':'Nejdřív si přidej nějaká jídla');return;}
  const stale=m=>{const l=lastCooked(m);return l?daysBetween(parseD(l),today()):1e6;};
  pool.sort((a,b)=>stale(b)-stale(a));
  let top=pool.slice(0,Math.max(3,Math.ceil(pool.length/2)));
  if(top.length>1)top=top.filter(m=>m.id!==lastPick);
  const m=top[Math.floor(Math.random()*top.length)];lastPick=m.id;
  const l=lastCooked(m);
  openModal('🎲 Tip na dnes',`<div class="pick"><div class="pi">${esc(m.icon)}</div><b>${esc(m.name)}</b>
    <div class="dmeta">${l?`naposledy ${ago(l)}`:'ještě jsi ho nevařil'}${m.time?` · ⏱️ ${m.time} min`:''}</div></div>
    <div class="dbtns"><button class="primary" data-pick="${m.id}">Otevřít recept</button>${pool.length>1?'<button data-pick="again">🎲 Jiný tip</button>':''}</div>
    <p class="hint" style="text-align:center">Vybírám z jídel, která jsi nevařil nejdéle${MS.tag?` (štítek „${esc(MS.tag)}“)`:''}.</p>`,null);
}

// ----- 🛒 nákup -----
function addToShop(m,serv){
  const lines=scaledLines(m,serv).map(lineText);if(!lines.length){toast('Recept nemá suroviny');return;}
  shop=shop.filter(x=>x.id!==m.id);shop.push({id:m.id,name:m.name,serv,lines});saveShop();renderMeals();
  toast(`🛒 ${m.name} (${serv} os.) je v nákupu`,'Otevřít',()=>openShop());
}
function shopText(){return shop.map(x=>`${x.name} (${x.serv} ${plural(x.serv,'osoba','osoby','osob')}):\n${x.lines.map(l=>'- '+l).join('\n')}`).join('\n\n');}
function openShop(){
  if(!shop.length){openModal('🛒 Nákup',`<p class="hint">Nákup je prázdný. V receptu klepni na „🛒 Do nákupu“ – suroviny se přidají přepočítané na zvolený počet osob.</p>`,null);return;}
  openModal('🛒 Nákup',`${shop.map(x=>`<div class="shopr"><div class="sh"><b>${esc(x.name)} <span class="hn" style="font-weight:400;color:var(--muted)">· ${x.serv} os.</span></b><button data-sdel="${esc(x.id)}" title="Odebrat z nákupu">✕</button></div>
      <ul>${x.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`).join('')}
    <div class="dbtns" style="margin-top:12px"><button class="primary" id="btnCopy">📋 Zkopírovat</button>${navigator.share?'<button id="btnShare">📤 Sdílet</button>':''}<button id="btnClearShop">Vyprázdnit</button></div>
    <textarea id="shopTxt" rows="4" readonly style="margin-top:8px;font-size:14px" aria-label="Nákup jako text">${esc(shopText())}</textarea>
    <div class="hint">Kdyby kopírování nešlo, označ text v poli výše a zkopíruj ho ručně.</div>`,null);
}
document.addEventListener('click',async e=>{
  if(e.target.id==='btnCopy'){const t=shopText();
    try{await navigator.clipboard.writeText(t);toast('📋 Zkopírováno – vlož do poznámek nebo zprávy');}
    catch(x){const ta=$('shopTxt');ta.focus();ta.select();try{document.execCommand('copy');toast('📋 Zkopírováno');}catch(y){toast('Označ text v poli a zkopíruj ho ručně');}}}
  if(e.target.id==='btnShare'){try{await navigator.share({title:'Nákup',text:shopText()});}catch(x){}}
  if(e.target.id==='btnClearShop'){const old=shop;shop=[];saveShop();renderMeals();closeModal();toast('Nákup vyprázdněn','↩️ Zpět',()=>{shop=old;saveShop();renderMeals();});}
});

// ===== 📤 Sdílení receptů (bez historie vaření) =====
const SHARE_FIELDS=['name','icon','tags','time','servings','ingredients','steps','note','source','rice'];
function recipeText(m,serv){
  const ing=scaledLines(m,serv||m.servings).map(lineText),st=stepList(m);
  return [`${m.icon} ${m.name}`+(m.time?` (⏱️ ${m.time} min)`:''),
    ing.length?`\nSuroviny pro ${serv||m.servings} ${plural(serv||m.servings,'osobu','osoby','osob')}:\n${ing.map(l=>'- '+l).join('\n')}`:'',
    st.length?`\nPostup:\n${st.map((x,i)=>`${i+1}. ${x}`).join('\n')}`:'',
    m.note.trim()?`\nPoznámky:\n${m.note.trim()}`:'',m.source.trim()?`\nZdroj: ${m.source.trim()}`:''].filter(Boolean).join('\n');
}
async function shareText(title,text){
  if(navigator.share){try{await navigator.share({title,text});return;}catch(e){if(e&&e.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(text);toast('📋 Recept zkopírován – vlož ho do zprávy');}
  catch(e){openModal('📤 '+title,`<p class="hint">Označ text a zkopíruj ho:</p><textarea rows="12" readonly style="font-size:14px">${esc(text)}</textarea>`,null);}
}
const updSelN=()=>{const n=$('mBody').querySelectorAll('.sel input:checked').length;$('mSave').textContent=$('mSave').dataset.lbl.replace('#',n);$('mSave').disabled=!n;};
function selList(rows){
  return`<div style="display:flex;justify-content:space-between;align-items:center"><span class="hint">Vyber recepty</span><button data-selall style="min-height:34px;padding:2px 10px;font-size:14px">Vybrat vše / nic</button></div>
    <ul class="sel">${rows.map(r=>`<li><label class="check"><input type="checkbox" value="${r.i}"${r.on?' checked':''}${r.dis?' disabled':''}> <span>${esc(r.icon)} ${esc(r.name)}</span>${r.st?`<span class="st">${r.st}</span>`:''}</label></li>`).join('')}</ul>`;
}
function exportRecipes(){
  if(!meals.length){toast('Zatím nemáš žádné recepty');return;}
  const list=[...meals].sort((a,b)=>a.name.localeCompare(b.name,'cs'));
  openModal('📤 Sdílet recepty',`<p class="hint" style="margin-top:0">Vznikne soubor jen s recepty – bez tvé historie vaření a bez ostatních dat. Druhý člověk ho načte ve Vaření přes „📥 Načíst recepty od někoho“.</p>
    ${selList(list.map((m,i)=>({i,icon:m.icon,name:m.name,on:true})))}`,
  async()=>{
    const pick=[...$('mBody').querySelectorAll('.sel input:checked')].map(c=>list[Number(c.value)]);if(!pick.length)return false;
    const payload={app:'life-admin',type:'recepty',version:1,exportedAt:new Date().toISOString(),
      items:pick.map(m=>Object.fromEntries(SHARE_FIELDS.map(f=>[f,m[f]])))};
    const name=`recepty-${isoD(today())}.json`,blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
    try{const file=new File([blob],name,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Recepty',text:`${pick.length} ${plural(pick.length,'recept','recepty','receptů')} z Life Adminu`});toast('📤 Odesláno');return;}}catch(e){if(e&&e.name==='AbortError')return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);toast(`💾 Uloženo: ${name} – pošli ho třeba e-mailem`);
  },{saveLabel:'Sdílet (#)',noDirty:true});
  $('mSave').dataset.lbl='Sdílet (#)';updSelN();
}
const normName=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
let pendingRec=[];
function importRecipesFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let j=null;try{j=JSON.parse(r.result);}catch(e){}
    let items=null;
    if(j&&j.type==='recepty'&&Array.isArray(j.items))items=j.items;
    else if(j&&j.app==='life-admin'&&j.data&&typeof j.data['vareni.items.v1']==='string'){try{items=JSON.parse(j.data['vareni.items.v1']);}catch(e){}}
    if(!Array.isArray(items)){toast('Tohle není soubor s recepty.');return;}
    pendingRec=items.map(x=>normMeal({...x,id:'tmp'})).filter(Boolean);
    if(!pendingRec.length){toast('V souboru nejsou žádné recepty.');return;}
    const have=new Set(meals.map(m=>normName(m.name)));
    const rows=pendingRec.map((m,i)=>{const dup=have.has(normName(m.name));return{i,icon:m.icon,name:m.name,on:!dup,st:dup?'už máš – přeskočím':'➕ nový'};});
    const newN=rows.filter(r=>r.on).length;
    openModal('📥 Načíst recepty',`<p class="hint" style="margin-top:0">Recepty se jen <b>přidají</b> – nic tvého se nezmění ani nesmaže. ${newN<rows.length?'Recepty se stejným názvem, jaký už máš, jsou odškrtnuté – zaškrtni je, pokud je chceš i tak (přidají se jako kopie).':''}</p>${selList(rows)}`,
    ()=>{
      const pick=[...$('mBody').querySelectorAll('.sel input:checked')].map(c=>pendingRec[Number(c.value)]);if(!pick.length)return false;
      const names=new Set(meals.map(m=>normName(m.name)));
      for(const m of pick){let nm=m.name;if(names.has(normName(nm))){let k=2;while(names.has(normName(`${m.name} (${k})`)))k++;nm=`${m.name} (${k})`;}
        names.add(normName(nm));meals.push({...m,id:uid(),name:nm,cooked:[],createdAt:new Date().toISOString()});}
      saveMeals();renderMeals();toast(`📥 Přidáno ${pick.length} ${plural(pick.length,'recept','recepty','receptů')}`);
    },{saveLabel:'Přidat (#)',noDirty:true});
    $('mSave').dataset.lbl='Přidat (#)';updSelN();
  };
  r.readAsText(file);
}
$('btnExport').onclick=exportRecipes;
$('btnImport').onclick=()=>{$('fileRec').value='';$('fileRec').click();};
$('fileRec').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importRecipesFile(f);});
$('mBody').addEventListener('change',e=>{if(e.target.closest('.sel'))updSelN();});

publish();setTab(tab);
render();
</script>
