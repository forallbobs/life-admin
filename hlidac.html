<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hlídač stránek</title>
<style>
:root{--bg:#f5f5f2;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--line:#e2e1dc;--accent:#0f766e;--accent-bg:#e6f4f2;
--red:#c62828;--red-bg:#fdecec;--orange:#b45309;--orange-bg:#fdf3e1;--green:#2e7d32;--green-bg:#e9f5ea}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#222220;--text:#eeeeea;--muted:#a3a29c;--line:#3a3a37;--accent:#2dd4bf;--accent-bg:#123330;
--red:#f28b82;--red-bg:#3b1d1d;--orange:#fbbf6a;--orange-bg:#3a2b12;--green:#81c995;--green-bg:#1b3021}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:26px;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 14px}
body.embedded .top{display:none}
body.embedded .wrap{padding-top:12px}
a{color:var(--accent)}
button,.btn{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;min-height:44px;display:inline-flex;align-items:center;text-decoration:none}
button:hover,.btn:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){button.primary{color:#10201e}}
.w{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.w.red{border-left-color:var(--red)}.w.orange{border-left-color:var(--orange)}.w.green{border-left-color:var(--green)}
.w h2{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.w .big{font-size:24px;font-weight:700;line-height:1.3}
.w .st{font-size:16px;margin-top:2px}
.st.red{color:var(--red);font-weight:600}.st.orange{color:var(--orange);font-weight:600}.st.muted{color:var(--muted)}
.w .meta{font-size:14px;color:var(--muted);margin-top:6px}
.w .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.newb{font-size:12px;background:var(--orange-bg);color:var(--orange);border-radius:999px;padding:1px 8px;font-weight:600}
.err{background:var(--red-bg);color:var(--red);border-radius:8px;padding:6px 10px;font-size:14px;margin-top:8px}
.info{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:15px;color:var(--muted)}
.info b{color:var(--text)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:4px}
.foot button{min-height:38px;font-size:14px;padding:4px 12px}
.ver{font-size:13px;color:var(--muted);margin-top:24px;opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><h1>🔔 Hlídač stránek</h1><p class="sub">Dobíječka Kaktus a ovladače AMD – změny ukážu v „Co hoří“.</p></header>
  <div id="list"></div>
  <div class="foot"><span id="checked"></span><button id="btnRefresh">↻ Načíst znovu</button></div>
  <div class="ver" id="ver"></div>
</div>
<script>
const APP_ID='hlidac',APP_VERSION='2026.11.24';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={};
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const KEY_DATA='hlidac.stav.v1',KEY_SEEN='hlidac.seen.v1';
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d);};
const fmtD=iso=>{const d=parseD(iso);return`${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}`;};
const DOW=['neděle','pondělí','úterý','středa','čtvrtek','pátek','sobota'];
const daysTo=iso=>Math.round((Date.UTC(...iso.split('-').map((v,i)=>i===1?v-1:+v))-Date.UTC(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()))/864e5);
const mins=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+m;};
function ago(iso){const m=Math.round((Date.now()-new Date(iso))/6e4);if(m<1)return'před chvílí';if(m<60)return`před ${m} min`;const h=Math.round(m/60);if(h<24)return`před ${h} h`;const d=Math.round(h/24);return d===1?'včera':`před ${d} dny`;}

// Odkud číst stav: soubor, který zapisuje GitHub Action, přímo z repozitáře (je vždy čerstvý a nejde přes mezipaměť aplikace)
function srcUrl(){
  const own=store.get('hlidac.src');if(own)return own;
  let owner='forallbobs',repo='life-admin';
  if(/\.github\.io$/.test(location.hostname)){owner=location.hostname.split('.')[0];const seg=location.pathname.split('/').filter(Boolean)[0];if(seg&&!seg.endsWith('.html'))repo=seg;}
  return`https://raw.githubusercontent.com/${owner}/${repo}/main/watch/stav.json`;
}
let data=null,seen={},loadErr='',loading=false;
try{data=JSON.parse(store.get(KEY_DATA)||'null');}catch(e){}
try{seen=JSON.parse(store.get(KEY_SEEN)||'{}')||{};}catch(e){seen={};}
const saveSeen=()=>store.set(KEY_SEEN,JSON.stringify(seen));

async function load(){
  if(loading)return;loading=true;$('btnRefresh').disabled=true;
  try{
    const u=srcUrl();const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    if(r.status===404){loadErr='nosetup';}
    else if(!r.ok)loadErr=`Stav se nepodařilo načíst (chyba ${r.status}).`;
    else{const j=await r.json();if(j&&j.items){data=j;store.set(KEY_DATA,JSON.stringify(j));loadErr='';}else loadErr='Soubor se stavem je poškozený.';}
  }catch(e){loadErr=navigator.onLine===false?'Jsi offline – ukazuji poslední známý stav.':'Stav se nepodařilo načíst – ukazuji poslední známý.';}
  loading=false;$('btnRefresh').disabled=false;
  // AMD: při prvním načtení si aktuální verzi jen zapamatuj (upozorní až na další novou)
  const a=data&&data.items&&data.items.amd;if(a&&a.key&&seen.amd===undefined){seen.amd=a.key;saveSeen();}
  render();
}

// ----- vyhodnocení -----
function kaktusState(k){
  if(!k||!k.date)return null;
  const d=daysTo(k.date),now=new Date(),nm=now.getHours()*60+now.getMinutes(),from=mins(k.from),to=mins(k.to);
  const time=k.from?`${k.from}${k.to?'–'+k.to:''}`:'';
  const s=seen.kaktus||{},isSeen=s.key===k.key&&(d!==0||s.on===isoD(new Date()));
  if(d<0||(d===0&&to!=null&&nm>=to))return{level:'muted',text:`Proběhla ${fmtD(k.date)}${time?' '+time:''}. Další zatím není vyhlášená.`,active:false,isSeen:true,time};
  if(d===0){
    if(from!=null&&nm>=from)return{level:'red',text:`PRÁVĚ TEĎ – do ${k.to||'?'}`,active:true,isSeen,time,alert:`Dobíječka právě běží – do ${k.to||'?'}`};
    let left='';if(from!=null){const m=from-nm;left=m>=60?` (za ${Math.floor(m/60)} h ${m%60} min)`:` (za ${m} min)`;}
    return{level:'red',text:`DNES ${time}${left}`,active:true,isSeen,time,alert:`Dobíječka je DNES ${time}`};
  }
  const dl=d===1?'zítra':`${DOW[parseD(k.date).getDay()]} ${fmtD(k.date)}`;
  return{level:'orange',text:`Bude ${dl} ${time}`,active:true,isSeen,time,alert:`Dobíječka bude ${dl} ${time}`};
}
const vnewer=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<3;i++)if((x[i]||0)!==(y[i]||0))return(x[i]||0)>(y[i]||0);return false;};

function render(){
  const it=(data&&data.items)||{},out=[];
  if(loadErr==='nosetup'&&!data){
    $('list').innerHTML=`<div class="info"><b>Hlídač ještě nemá data.</b><br>Na GitHubu musí být soubory <code>watch/hlidac.mjs</code> a <code>.github/workflows/hlidac.yml</code> a automat se musí aspoň jednou spustit (Actions → Hlídač stránek → Run workflow). Po prvním běhu se tu stav objeví sám.</div>`;
    $('checked').textContent='';publish([]);return;}
  // Kaktus
  const k=it.kaktus,ks=k&&k.ok!==undefined?kaktusState(k):null;
  out.push(`<div class="w ${ks&&ks.active&&!ks.isSeen?ks.level:ks&&ks.active?'green':''}"><h2>🌵 Kaktus – dobíječka ${ks&&ks.active&&!ks.isSeen?'<span class="newb">NOVÉ</span>':''}</h2>
    ${k&&k.date?`<div class="big">${fmtD(k.date)}${ks.time?' · '+esc(ks.time):''}</div><div class="st ${ks.level}">${esc(ks.text)}</div>`:'<div class="st muted">Zatím bez údaje.</div>'}
    ${k&&k.ok===false?`<div class="err">⚠️ Poslední kontrola selhala: ${esc(k.error||'')}${k.errorAt?` (${ago(k.errorAt)})`:''}. Ukazuji poslední známý údaj.</div>`:''}
    <div class="acts">${ks&&ks.active&&!ks.isSeen?'<button class="primary" data-seen="kaktus">✓ Viděno</button>':''}<a class="btn" href="${esc((k&&k.url)||'https://www.mujkaktus.cz/chces-pridat')}" target="_blank" rel="noopener">Otevřít stránku ↗</a></div>
    ${k&&k.changedAt?`<div class="meta">Údaj na stránce se změnil ${ago(k.changedAt)}.</div>`:''}</div>`);
  // AMD
  const a=it.amd,aNew=a&&a.key&&seen.amd&&a.key!==seen.amd&&vnewer(a.key,seen.amd);
  out.push(`<div class="w ${aNew?'orange':a&&a.key?'green':''}"><h2>🖥️ AMD RX 6600 XT – ovladač Windows 11 ${aNew?'<span class="newb">NOVÝ</span>':''}</h2>
    ${a&&a.latest?`<div class="big">${esc(a.latest.version)}</div><div class="st ${aNew?'orange':'muted'}">${aNew?`Nová verze (předtím ${esc(seen.amd)}) – `:'Nejnovější: '}${esc(a.latest.kind)}</div>
      ${a.whql&&a.whql.version!==a.latest.version?`<div class="meta">Doporučený (WHQL): ${esc(a.whql.version)}</div>`:''}`:'<div class="st muted">Zatím bez údaje.</div>'}
    ${a&&a.ok===false?`<div class="err">⚠️ Poslední kontrola selhala: ${esc(a.error||'')}${a.errorAt?` (${ago(a.errorAt)})`:''}. Ukazuji poslední známý údaj.</div>`:''}
    <div class="acts">${aNew?'<button class="primary" data-seen="amd">✓ Viděno</button>':''}<a class="btn" href="${esc((a&&a.url)||'#')}" target="_blank" rel="noopener">Stránka AMD ↗</a>${a&&a.latest&&a.latest.url?`<a class="btn" href="${esc(a.latest.url)}" target="_blank" rel="noopener">⬇️ Stáhnout ${esc(a.latest.version)}</a>`:''}</div>
    ${a&&a.changedAt?`<div class="meta">Verze se na stránce změnila ${ago(a.changedAt)}.</div>`:''}</div>`);
  const stale=data&&data.checkedAt&&(Date.now()-new Date(data.checkedAt))>18*36e5;
  if(stale)out.push(`<div class="err">⚠️ Automat na GitHubu ${ago(data.checkedAt)} nic nezapsal – možná neběží. Zkontroluj na GitHubu záložku Actions.</div>`);
  if(loadErr&&loadErr!=='nosetup')out.push(`<div class="meta" style="color:var(--muted);font-size:14px">${esc(loadErr)}</div>`);
  $('list').innerHTML=out.join('');
  $('checked').textContent=data&&data.checkedAt?`Automat zkontroloval ${ago(data.checkedAt)} (každou půlhodinu 6–21 h)`:'';
  // upozornění pro „Co hoří“
  const alerts=[];
  if(ks&&ks.active&&!ks.isSeen)alerts.push({level:ks.level==='red'?'red':'orange',title:'🌵 '+ks.alert,sub:'Kaktus – dobij aspoň 200 Kč, dostaneš jednou tolik',date:k.date});
  if(aNew)alerts.push({level:'orange',title:`🖥️ Nový ovladač AMD ${a.latest.version}`,sub:`RX 6600 XT, Windows 11 – ${a.latest.kind}`,date:isoD(new Date((a.changedAt||Date.now())))});
  publish(alerts,ks,a);
}
function publish(alerts,ks,a){
  try{
    const hl=[];if(ks&&ks.active)hl.push({label:'Dobíječka',value:ks.text.replace(/^Bude /,'')});if(a&&a.latest)hl.push({label:'AMD ovladač',value:a.latest.version});
    store.set('lifeadmin.summary.'+APP_ID,JSON.stringify({v:1,ver:APP_VERSION,updated:new Date().toISOString(),count:2,
      desc:'Dobíječka Kaktus a nové ovladače AMD.',headline:hl,alerts}));
    if(EMBED)parent.postMessage({type:'lifeadmin:summary',id:APP_ID},location.origin==='null'?'*':location.origin);
  }catch(e){}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-seen]');if(!b)return;
  const it=data.items||{};
  if(b.dataset.seen==='kaktus')seen.kaktus={key:it.kaktus.key,on:isoD(new Date())};
  if(b.dataset.seen==='amd')seen.amd=it.amd.key;
  saveSeen();render();
});
$('btnRefresh').onclick=load;
window.addEventListener('storage',e=>{
  if(e.key===KEY_SEEN){try{seen=JSON.parse(e.newValue||'{}')||{};}catch(x){}render();}
  if(e.key===KEY_DATA){try{data=JSON.parse(e.newValue||'null');}catch(x){}render();}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
setInterval(()=>{if(!document.hidden)render();},60000);
setInterval(()=>{if(!document.hidden)load();},15*60000);

const EMBED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
if(EMBED)document.body.classList.add('embedded');
$('ver').textContent='Hlídač · verze '+APP_VERSION;
render();load();
</script>
</body>
</html>
