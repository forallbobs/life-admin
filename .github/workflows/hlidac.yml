name: Hlídač stránek

on:
  schedule:
    # každou půlhodinu 6–21 h našeho času (GitHub počítá v UTC a občas se o pár minut zpozdí)
    - cron: '7,37 5-19 * * *'
  workflow_dispatch:        # tlačítko „Run workflow“ pro ruční spuštění

permissions:
  contents: write

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Zkontrolovat stránky
        run: node watch/hlidac.mjs
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - name: Uložit změny
        run: |
          if [ -n "$(git status --porcelain watch/stav.json)" ]; then
            git config user.name "hlidac-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add watch/stav.json
            git commit -m "Hlídač: aktualizace stavu"
            git push
          fi
